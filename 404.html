<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tipiṭaka Multi-Edition - Redirecting</title>
  <script>
    // GitHub Pages 404 router fallback
    const pathname = window.location.pathname.replace(/^\/+/g, '');
    const search = window.location.search;
    if (pathname && (pathname.startsWith('tipitaka') || pathname.endsWith('.html') || pathname.endsWith('.md'))) {
      const clean = pathname.replace(/\.html$/, '.md');
      window.location.replace('/reader.html?file=' + encodeURIComponent(clean) + (search ? '&' + search.slice(1) : ''));
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting to Tipiṭaka viewer...</p>
</body>
</html>
